# Render deployment config for the frontend (Node Web Service).
#
# We run a small Node reverse proxy (server.js) instead of a static site.
# Reason: the backend authenticates with HttpOnly cookies, which the browser
# only stores/sends when the request is FIRST-PARTY (same origin as the page).
# A Render *static-site* proxy forwards /api requests but does NOT reliably relay
# the backend's Set-Cookie back to the browser, so the auth cookie is never
# stored and authenticated calls (e.g. the profile PATCH) return 401.
#
# server.js serves the built dist/ AND proxies /api to the backend, relaying
# cookies and presenting the request as same-origin — exactly what the Vite dev
# proxy does (vite.config.js), which is why auth works locally.
services:
  - type: web
    name: isourceplus-frontend
    runtime: node
    plan: free
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm run start
    healthCheckPath: /healthz
    envVars:
      # Canonical backend origin the proxy forwards /api to.
      - key: API_TARGET
        value: https://www.isourceplus.net
      - key: NODE_VERSION
        value: "20"
