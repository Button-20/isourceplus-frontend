# Render deployment config for the frontend (Static Site).
#
# The whole point of this file is the `/api/*` rewrite below. The backend
# authenticates with HttpOnly cookies, and browsers only send those cookies when
# the request is FIRST-PARTY (same origin as the page). Our static site is served
# from a different origin than the API (e.g. *.onrender.com vs isourceplus.net),
# so calling the API directly makes the auth cookie third-party — modern browsers
# strip it, and `account_auth/token/refresh/` comes back 401 with no Cookie
# header. Reverse-proxying `/api/*` through Render means the browser only ever
# talks to OUR origin, keeping the cookie first-party. This mirrors the Vite dev
# proxy (see vite.config.js), which is why auth works locally.
services:
  - type: web
    name: isourceplus-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      # Reverse-proxy all API traffic to the backend. MUST come before the SPA
      # catch-all so it wins for /api paths. The trailing wildcard is preserved,
      # so /api/v1/account_auth/token/refresh/ -> isourceplus.net/api/v1/...
      - type: rewrite
        source: /api/*
        destination: https://isourceplus.net/api/*
      # SPA fallback: every other path serves the app shell for client routing.
      - type: rewrite
        source: /*
        destination: /index.html
